name: Build and release PCLR

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug, Snapshot]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - name: Build, verify and package
        shell: pwsh
        run: ./scripts/Build-Release.ps1 -Configuration '${{ matrix.configuration }}'
      - uses: actions/upload-artifact@v7
        with:
          name: PCLR-${{ matrix.configuration }}
          path: |
            artifacts/*.zip
            artifacts/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Complete source package and checksums
        shell: pwsh
        run: |
          ./scripts/Package-Source.ps1
          Get-ChildItem artifacts -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content artifacts/SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' artifacts/* --verify-tag --title 'PCLR ${{ github.ref_name }}' --notes-file docs/RELEASE.md --latest
